[package]
name = "vista-terminal"
version = "0.1.0"
edition = "2021"
description = "A living pixel landscape that greets you every time a terminal opens"
authors = ["Tri Aldy Kurniawan"]
license = "MIT"
readme = "README.md"
keywords = ["terminal", "pixel-art", "powershell", "greeter", "windows"]
categories = ["command-line-utilities"]
repository = "https://github.com/trialdyk/vista-terminal"
exclude = ["assets/", ".github/"]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "vista"
path = "src/main.rs"
